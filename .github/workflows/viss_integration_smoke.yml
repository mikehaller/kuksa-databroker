name: VISS integration collection smoke

on:
  pull_request:
    paths:
      - integration_test/viss/**
      - integration_test/provider.py
      - .github/workflows/viss_integration_smoke.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  collect-viss-tests:
    name: Collect VISS integration scenarios
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install VISS test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r integration_test/viss/requirements.txt

      - name: Collect VISS v2/v3 scenarios
        working-directory: ${{ github.workspace }}/integration_test
        env:
          NO_PROXY: "*"
          PYTHONPATH: ${{ github.workspace }}/integration_test
        run: |
          pytest --collect-only -c viss/pytest.ini viss/tests/test_viss_v2.py viss/tests/test_viss_v3.py
